<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GoalTrack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
body{background:#0b141a;color:#e9edef;overflow:hidden;height:100vh}
input,textarea,button{font-family:inherit}

#frontPage{height:100vh;display:flex;flex-direction:column;align-items:center;overflow-y:auto}
.front-header{width:100%;background:#075E54;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.front-logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:#fff}
.front-logo span{font-size:24px}
.search-container{width:100%;max-width:500px;padding:24px 16px 8px}
.search-box{display:flex;gap:8px}
.search-box input{flex:1;padding:12px 16px;border-radius:24px;border:none;background:#1f2c34;color:#e9edef;font-size:15px;outline:none}
.search-box input:focus{background:#243640}
.search-box button{padding:12px 20px;border-radius:24px;border:none;background:#128C7E;color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.front-content{width:100%;max-width:600px;padding:16px;flex:1}
.front-title{font-size:18px;font-weight:700;margin-bottom:14px;text-align:center;color:#8696a0}
.scraped-list{display:flex;flex-direction:column;gap:8px}
.scraped-item{display:flex;align-items:center;gap:12px;padding:12px;background:#111b21;border-radius:8px}
.scraped-item .num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#128C7E;border-radius:50%;font-weight:700;font-size:13px;color:#fff}
.scraped-item .info{flex:1}
.scraped-item .name{font-size:14px;font-weight:600}
.scraped-item .team{font-size:11px;color:#8696a0}
.scraped-item .goals{font-size:16px;font-weight:700;color:#25D366}
.front-footer{padding:16px;text-align:center;font-size:10px;color:#3b4a54}

#chatApp{display:none;height:100vh;flex-direction:column}
#chatApp.active{display:flex}
#nameScreen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.name-card{width:100%;max-width:320px;text-align:center}
.name-card .icon{width:72px;height:72px;border-radius:50%;background:#128C7E;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:32px}
.name-card h2{font-size:24px;font-weight:300;margin-bottom:8px}
.name-card p{font-size:14px;color:#8696a0;margin-bottom:28px}
.name-input{width:100%;padding:14px 16px;border-radius:8px;border:1px solid #2a3942;background:#1f2c34;color:#e9edef;font-size:15px;outline:none;margin-bottom:12px;text-align:center}
.name-input:focus{border-color:#128C7E}
.name-btn{width:100%;padding:14px;border-radius:8px;border:none;background:#128C7E;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.name-btn:disabled{background:#1a2a32;cursor:not-allowed}

#chatScreen{display:none;flex:1;flex-direction:column;height:100vh}
#chatScreen.active{display:flex}
.chat-header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#1f2c34;border-bottom:1px solid #2a3942;flex-shrink:0}
.chat-header .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}
.chat-header .info{flex:1}
.chat-header .info h2{font-size:16px;font-weight:600}
.chat-header .info p{font-size:12px;color:#8696a0}
.chat-header .logout{padding:6px 10px;border-radius:6px;background:none;border:none;color:#8696a0;font-size:13px;cursor:pointer}

.messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px;background-color:#0b141a;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23121b22' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 0v4h4v2H6v4H4V6H0V4h4V0h2zm0 30v4h4v2H6v4H4v-4H0v-2h4v-4h2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");padding-bottom:4px}
.msg-row{display:flex;width:100%;margin-bottom:2px}
.msg-row.me{justify-content:flex-end}
.msg-row.them{justify-content:flex-start}
.msg-bubble{max-width:75%;padding:6px 10px 8px;border-radius:8px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg-row.me .msg-bubble{background:#005C4B;color:#e9edef;border-top-right-radius:2px}
.msg-row.them .msg-bubble{background:#1f2c34;color:#e9edef;border-top-left-radius:2px}
.msg-sender{font-size:12px;font-weight:600;margin-bottom:2px;color:#06cf9c}
.msg-admin-badge{font-size:9px;background:#06cf9c;color:#005C4B;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:700}
.msg-time{font-size:10px;color:#8696a0;float:right;margin-top:2px;margin-left:8px}
.date-sep{display:flex;justify-content:center;margin:12px 0}
.date-sep span{background:#1f2c34;color:#8696a0;font-size:12px;padding:4px 12px;border-radius:8px}

.input-bar{flex-shrink:0;background:#1f2c34;padding:8px 12px;display:flex;align-items:flex-end;gap:8px;border-top:1px solid #2a3942}
.msg-input-wrap{flex:1;background:#2a3942;border-radius:24px;padding:2px}
.msg-input{width:100%;min-height:40px;max-height:120px;padding:10px 14px;background:none;border:none;color:#e9edef;font-size:14px;resize:none;outline:none;line-height:1.4}
.msg-input::placeholder{color:#8696a0}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:#128C7E;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:transform 0.1s}
.send-btn:active{transform:scale(0.9)}

.img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;justify-content:center;align-items:center}
.img-modal.active{display:flex}
.img-modal img{max-width:95%;max-height:95%}
.img-modal .close{position:absolute;top:16px;right:16px;color:#fff;font-size:32px;cursor:pointer;background:rgba(0,0,0,0.5);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#128C7E;color:#fff;border-radius:24px;font-size:13px;z-index:200}
</style>
</head>
<body>

<div id="frontPage">
  <div class="front-header">
    <div class="front-logo"><span>⚽</span> GoalTrack</div>
  </div>
  <div class="search-container"><div class="search-box">
    <input type="text" id="searchInput" placeholder="Rechercher un joueur..." autocomplete="off">
    <button onclick="handleSearch()">OK</button>
  </div></div>
  <div class="front-content">
    <div class="front-title">Top Scoreurs</div>
    <div class="scraped-list" id="scrapedList"></div>
  </div>
  <div class="front-footer">GoalTrack © 2026</div>
</div>

<div id="chatApp">
  <div id="nameScreen"><div class="name-card">
    <div class="icon">💬</div>
    <h2>Bienvenue</h2>
    <p>Entrez votre nom pour discuter en privé</p>
    <input type="text" class="name-input" id="nameInput" placeholder="Votre nom..." maxlength="30" autocomplete="off">
    <button class="name-btn" id="nameBtn" disabled>Commencer</button>
  </div></div>
  <div id="chatScreen">
    <div class="chat-header">
      <div class="avatar" id="chatAvatar"></div>
      <div class="info"><h2 id="chatName"></h2><p>en ligne</p></div>
      <button class="logout" onclick="doLogout()">Quitter</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <div class="msg-input-wrap"><textarea class="msg-input" id="msgInput" placeholder="Message" rows="1"></textarea></div>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
const API='https://base44.app/api/apps/6a10802fc1e2a32a74055143/functions/hiddenChat';
const CODE='00004444';
let userName=null,sessionId=null,messages=[],poll=null;

function getSess(){let id=localStorage.getItem('gt_s');if(!id){id='s_'+Date.now()+'_'+Math.random().toString(36).substring(2,12);localStorage.setItem('gt_s',id)}return id}

function initFront(){
  const ps=[{n:'Haaland',t:'Man City',g:19},{n:'Salah',t:'Liverpool',g:15},{n:'Mbappé',t:'Real Madrid',g:14},{n:'Kane',t:'Bayern',g:13},{n:'Saka',t:'Arsenal',g:11},{n:'Palmer',t:'Chelsea',g:9},{n:'Son',t:'Tottenham',g:8},{n:'Foden',t:'Man City',g:7}];
  const l=document.getElementById('scrapedList');
  ps.forEach((p,i)=>{const d=document.createElement('div');d.className='scraped-item';d.innerHTML=`<div class="num">${i+1}</div><div class="info"><div class="name">${p.n}</div><div class="team">${p.t}</div></div><div class="goals">⚽ ${p.g}</div>`;l.appendChild(d)});
}
function handleSearch(){const v=document.getElementById('searchInput').value.trim();if(v===CODE){document.getElementById('frontPage').style.display='none';document.getElementById('chatApp').classList.add('active');initName()}else{document.getElementById('scrapedList').innerHTML='<div style="text-align:center;padding:30px;color:#8696a0">Aucun joueur</div>'}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement.id==='searchInput')handleSearch()});

function initName(){
  const sn=localStorage.getItem('gt_name'),ss=localStorage.getItem('gt_s');
  if(sn&&ss){userName=sn;sessionId=ss;showChat();return}
  sessionId=getSess();
  const i=document.getElementById('nameInput'),b=document.getElementById('nameBtn');
  i.oninput=()=>{b.disabled=i.value.trim().length<2};
  i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim().length>=2)doLogin()};
  b.onclick=doLogin;i.focus();
}
function doLogin(){const n=document.getElementById('nameInput').value.trim();if(n.length<2)return;userName=n;sessionId=getSess();localStorage.setItem('gt_name',n);showChat()}
function doLogout(){localStorage.removeItem('gt_name');localStorage.removeItem('gt_s');userName=null;sessionId=null;if(poll)clearInterval(poll);document.getElementById('chatScreen').classList.remove('active');document.getElementById('nameScreen').style.display='flex';document.getElementById('nameInput').value='';document.getElementById('nameBtn').disabled=true}

function colorFor(n){const c=['#128C7E','#075E54','#db2777','#7c3aed','#2563eb','#16a34a','#dc2626','#ea580c'];let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return c[Math.abs(h)%c.length]}

function showChat(){
  document.getElementById('nameScreen').style.display='none';
  document.getElementById('chatScreen').classList.add('active');
  const av=document.getElementById('chatAvatar');av.textContent=userName.charAt(0).toUpperCase();av.style.background=colorFor(userName);
  document.getElementById('chatName').textContent=userName;
  fetchMsg();poll=setInterval(fetchMsg,2000);
  const i=document.getElementById('msgInput');
  i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}};
  i.oninput=()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'};
}

async function fetchMsg(){
  try{const r=await fetch(API+'?conversation_id='+encodeURIComponent(sessionId));const d=await r.json();if(d.messages){messages=d.messages;render()}}catch(e){}
}

function render(){
  const c=document.getElementById('messages');c.innerHTML='';
  if(messages.length===0){c.innerHTML='<div class="date-sep"><span>💬 Messages privés</span></div><div style="text-align:center;padding:30px;color:#8696a0;font-size:13px">Écrivez quelque chose...</div>';return}
  let lastDate='';
  messages.forEach(msg=>{
    const d=new Date(msg.created_at);
    const ds=d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
    if(ds!==lastDate){lastDate=ds;const s=document.createElement('div');s.className='date-sep';s.innerHTML=`<span>${ds}</span>`;c.appendChild(s)}
    const isAdmin=msg.sender==='Admin',isMe=msg.sender===userName;
    const row=document.createElement('div');row.className='msg-row '+(isMe?'me':'them');
    const bub=document.createElement('div');bub.className='msg-bubble';
    const t=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    let h='';
    if(!isMe&&isAdmin)h+=`<div class="msg-sender">Admin <span class="msg-admin-badge">ADMIN</span></div>`;
    if(msg.msg_type==='image'&&msg.file_url){
      h+=`<img src="${msg.file_url}" style="max-width:200px;max-height:200px;border-radius:6px;display:block;margin-bottom:2px" onclick="openImg('${msg.file_url}')">`;
      h+=`<span class="msg-time">${t}</span>`;
      if(msg.content)h+=`<div style="font-size:12px;margin-top:2px">${esc(msg.content)}</div>`;
    }else if(msg.msg_type==='voice'&&msg.file_url){
      h+=`<div style="display:flex;align-items:center;gap:10px;padding:6px 0"><button onclick="playV('${msg.file_url}',this)" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:16px;cursor:pointer">▶</button><span style="font-size:12px;color:#8696a0">${msg.content||''}</span></div><span class="msg-time">${t}</span>`;
    }else if(msg.msg_type==='location'){
      h+=`<a href="https://maps.google.com/?q=${msg.location_lat},${msg.location_lng}" target="_blank" style="color:#53bdeb;text-decoration:none;font-size:13px">📍 Position partagée</a><span class="msg-time">${t}</span>`;
    }else if(msg.msg_type==='file'&&msg.file_url){
      h+=`<a href="${msg.file_url}" download style="color:#53bdeb;text-decoration:none;font-size:13px">📄 ${esc(msg.content||'Fichier')}</a><span class="msg-time">${t}</span>`;
    }else{
      h+=`<div>${esc(msg.content)}</div><span class="msg-time">${t}</span>`;
    }
    bub.innerHTML=h;row.appendChild(bub);c.appendChild(row);
  });
  c.scrollTop=c.scrollHeight;
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function sendMsg(){
  const i=document.getElementById('msgInput'),t=i.value.trim();
  if(!t)return;i.value='';i.style.height='auto';
  try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:userName,content:t,msgType:'text',conversationId:sessionId})});await fetchMsg()}catch(e){toast('Erreur')}
}

function openImg(u){document.getElementById('imgModalSrc').src=u;document.getElementById('imgModal').classList.add('active')}
function closeImgModal(){document.getElementById('imgModal').classList.remove('active')}
function playV(u,b){if(b._a){b._a.pause();b._a=null;b.textContent='▶';return}const a=new Audio(u);b._a=a;b.textContent='⏸';a.onended=()=>{b.textContent='▶';b._a=null};a.play().catch(()=>b.textContent='▶')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}

initFront();
</script>
</body>
</html>
