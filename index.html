<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GoalTrack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
:root{--bg:#0b141a;--bg2:#111b21;--bg3:#1f2c34;--bg4:#2a3942;--green:#128C7E;--green2:#005C4B;--green3:#075E54;--text:#e9edef;--gray:#8696a0;--date:#1f2c34}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
input,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

/* FRONT PAGE */
#front{height:100%;display:flex;flex-direction:column;overflow-y:auto}
.f-header{background:var(--green3);padding:12px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10}
.f-header .logo{font-size:18px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.f-search{padding:20px 16px 8px}
.f-search-bar{display:flex;gap:6px}
.f-search-bar input{flex:1;padding:12px 16px;border-radius:24px;border:none;background:var(--bg3);color:var(--text);font-size:15px;outline:none}
.f-search-bar button{padding:0 18px;border-radius:24px;background:var(--green);color:#fff;font-weight:600;font-size:14px}
.f-list{padding:12px 16px;flex:1}
.f-list-title{font-size:15px;font-weight:600;color:var(--gray);margin-bottom:12px}
.f-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border-radius:8px;margin-bottom:6px}
.f-item .n{width:32px;height:32px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.f-item .nm{font-size:14px;font-weight:600}
.f-item .tm{font-size:11px;color:var(--gray)}
.f-item .g{font-size:16px;font-weight:700;color:#25D366;margin-left:auto}
.f-footer{padding:12px;text-align:center;font-size:10px;color:var(--gray)}

/* CHAT APP */
#app{display:none;height:100%;flex-direction:column}
#app.show{display:flex}

/* NAME SCREEN */
#name{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.n-card{text-align:center;width:100%;max-width:300px}
.n-ico{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}
.n-card h2{font-size:22px;font-weight:400;margin-bottom:6px}
.n-card p{font-size:13px;color:var(--gray);margin-bottom:24px}
.n-input{width:100%;padding:14px;border-radius:8px;border:1px solid var(--bg4);background:var(--bg3);color:var(--text);font-size:15px;text-align:center;outline:none;margin-bottom:10px}
.n-input:focus{border-color:var(--green)}
.n-btn{width:100%;padding:14px;border-radius:8px;background:var(--green);color:#fff;font-weight:600;font-size:15px}
.n-btn:disabled{background:#1a2a32;color:var(--gray)}

/* CHAT SCREEN */
#chat{display:none;height:100%;flex-direction:column}
#chat.show{display:flex}
.c-header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);flex-shrink:0}
.c-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0}
.c-info{flex:1;min-width:0}
.c-info h2{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-info p{font-size:11px;color:var(--gray)}
.c-quit{padding:6px 10px;border-radius:6px;color:var(--gray);font-size:13px}

.c-msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 8px;display:flex;flex-direction:column;gap:1px;background:var(--bg)}
.r{display:flex;width:100%}
.r.me{justify-content:flex-end}
.r.them{justify-content:flex-start}
.b{max-width:78%;padding:5px 9px 7px;border-radius:8px;font-size:14px;line-height:1.4;word-break:break-word;position:relative}
.r.me .b{background:var(--green2);border-top-right-radius:2px}
.r.them .b{background:var(--bg3);border-top-left-radius:2px}
.b-sender{font-size:12px;font-weight:600;margin-bottom:1px;color:#06cf9c}
.b-badge{font-size:8px;background:#06cf9c;color:var(--green2);padding:1px 4px;border-radius:3px;margin-left:3px;font-weight:700}
.b-time{font-size:9px;color:rgba(255,255,255,0.4);float:right;margin-top:3px;margin-left:6px;user-select:none}
.d-sep{display:flex;justify-content:center;margin:10px 0}
.d-sep span{background:var(--date);color:var(--gray);font-size:11px;padding:3px 10px;border-radius:6px}
.empty{text-align:center;padding:30px 16px;color:var(--gray);font-size:13px}

.c-bar{flex-shrink:0;display:flex;align-items:flex-end;gap:6px;padding:6px 10px;background:var(--bg3);border-top:1px solid rgba(255,255,255,0.05)}
.c-bar .wrap{flex:1;background:var(--bg4);border-radius:22px;padding:1px}
.c-input{width:100%;min-height:38px;max-height:100px;padding:9px 12px;background:none;border:none;color:var(--text);font-size:14px;resize:none;outline:none;line-height:1.3}
.c-input::placeholder{color:var(--gray)}
.c-send{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s}
.c-send:active{transform:scale(0.85)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:8px 18px;background:var(--green);color:#fff;border-radius:20px;font-size:12px;z-index:200;animation:fi 0.2s}
@keyframes fi{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1}}
</style>
</head>
<body>

<div id="front">
  <div class="f-header"><div class="logo">⚽ GoalTrack</div></div>
  <div class="f-search"><div class="f-search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher..." autocomplete="off">
    <button onclick="doSearch()">OK</button>
  </div></div>
  <div class="f-list"><div class="f-list-title">Top Scoreurs</div><div id="playerList"></div></div>
  <div class="f-footer">GoalTrack © 2026</div>
</div>

<div id="app">
  <div id="name"><div class="n-card">
    <div class="n-ico">💬</div>
    <h2>Bienvenue</h2>
    <p>Entrez votre nom pour discuter</p>
    <input class="n-input" id="nameInput" placeholder="Votre nom..." maxlength="30" autocomplete="off">
    <button class="n-btn" id="nameBtn" disabled>Commencer</button>
  </div></div>
  <div id="chat">
    <div class="c-header">
      <div class="c-avatar" id="cAvatar"></div>
      <div class="c-info"><h2 id="cName"></h2><p>en ligne</p></div>
      <button class="c-quit" onclick="doQuit()">Quitter</button>
    </div>
    <div class="c-msgs" id="cMsgs"></div>
    <div class="c-bar">
      <div class="wrap"><textarea class="c-input" id="cInput" placeholder="Message" rows="1"></textarea></div>
      <button class="c-send" onclick="doSend()">➤</button>
    </div>
  </div>
</div>

<script>
const API='https://base44.app/api/apps/6a10802fc1e2a32a74055143/functions/hiddenChat';
const CODE='00004444';
const KEY_NAME='gt_name';
const KEY_SESS='gt_sess';
let myName=null,mySess=null,msgs=[],timer=null;

// Session management - persists in localStorage
function getSession(){
  let s=localStorage.getItem(KEY_SESS);
  if(!s){s='s_'+Date.now()+'_'+Math.random().toString(36).substring(2,12);localStorage.setItem(KEY_SESS,s);}
  return s;
}

// Front page
function initFront(){
  const ps=[{n:'Haaland',t:'Man City',g:19},{n:'Salah',t:'Liverpool',g:15},{n:'Mbappé',t:'Real Madrid',g:14},{n:'Kane',t:'Bayern',g:13},{n:'Saka',t:'Arsenal',g:11},{n:'Palmer',t:'Chelsea',g:9},{n:'Son',t:'Tottenham',g:8},{n:'Foden',t:'Man City',g:7}];
  const l=document.getElementById('playerList');
  l.innerHTML=ps.map((p,i)=>`<div class="f-item"><div class="n">${i+1}</div><div><div class="nm">${p.n}</div><div class="tm">${p.t}</div></div><div class="g">⚽ ${p.g}</div></div>`).join('');
}

function doSearch(){
  const v=document.getElementById('searchInput').value.trim();
  if(v===CODE){
    document.getElementById('front').style.display='none';
    document.getElementById('app').classList.add('show');
    initName();
  }else{
    document.getElementById('playerList').innerHTML='<div style="text-align:center;padding:24px;color:#8696a0">Aucun résultat</div>';
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='searchInput')doSearch();
});

// Name screen
function initName(){
  // Check if already logged in
  const savedName=localStorage.getItem(KEY_NAME);
  const savedSess=localStorage.getItem(KEY_SESS);
  if(savedName&&savedSess){
    myName=savedName;mySess=savedSess;
    openChat();return;
  }
  mySess=getSession();
  const inp=document.getElementById('nameInput');
  const btn=document.getElementById('nameBtn');
  inp.oninput=()=>{btn.disabled=inp.value.trim().length<2};
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim().length>=2)login()};
  btn.onclick=login;
  inp.focus();
}

function login(){
  const v=document.getElementById('nameInput').value.trim();
  if(v.length<2)return;
  myName=v;
  mySess=getSession();
  localStorage.setItem(KEY_NAME,v);
  openChat();
}

function doQuit(){
  localStorage.removeItem(KEY_NAME);
  localStorage.removeItem(KEY_SESS);
  myName=null;mySess=null;
  if(timer)clearInterval(timer);
  document.getElementById('chat').classList.remove('show');
  document.getElementById('name').style.display='flex';
  document.getElementById('nameInput').value='';
  document.getElementById('nameBtn').disabled=true;
}

function colorFor(n){
  const c=['#128C7E','#075E54','#db2777','#7c3aed','#2563eb','#16a34a','#dc2626','#ea580c'];
  let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);
  return c[Math.abs(h)%c.length];
}

function openChat(){
  document.getElementById('name').style.display='none';
  document.getElementById('chat').classList.add('show');
  const av=document.getElementById('cAvatar');
  av.textContent=myName.charAt(0).toUpperCase();
  av.style.background=colorFor(myName);
  document.getElementById('cName').textContent=myName;
  // Load messages
  loadMsgs();
  timer=setInterval(loadMsgs,2000);
  // Setup input
  const inp=document.getElementById('cInput');
  inp.onkeydown=e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}
  };
  inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px';};
  inp.focus();
}

async function loadMsgs(){
  try{
    const r=await fetch(API+'?conversation_id='+encodeURIComponent(mySess));
    const d=await r.json();
    if(d&&d.messages){msgs=d.messages;drawMsgs();}
  }catch(e){}
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function drawMsgs(){
  const c=document.getElementById('cMsgs');
  if(!msgs.length){
    c.innerHTML='<div class="d-sep"><span>💬 Messages privés</span></div><div class="empty">Écrivez quelque chose...</div>';
    return;
  }
  let html='',lastDate='';
  msgs.forEach(m=>{
    const d=new Date(m.created_at);
    const ds=d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
    if(ds!==lastDate){lastDate=ds;html+='<div class="d-sep"><span>'+ds+'</span></div>';}
    const isAdmin=m.sender==='Admin';
    const isMe=m.sender===myName;
    const t=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    let inner='';
    if(!isMe&&isAdmin)inner+='<div class="b-sender">Admin <span class="b-badge">ADMIN</span></div>';
    inner+='<div>'+esc(m.content)+'</div><span class="b-time">'+t+'</span>';
    html+='<div class="r '+(isMe?'me':'them')+'"><div class="b">'+inner+'</div></div>';
  });
  c.innerHTML=html;
  c.scrollTop=c.scrollHeight;
}

async function doSend(){
  const inp=document.getElementById('cInput');
  const txt=inp.value.trim();
  if(!txt)return;
  inp.value='';inp.style.height='auto';
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      sender:myName,content:txt,msgType:'text',conversationId:mySess
    })});
    await loadMsgs();
  }catch(e){toast('Erreur d\'envoi');}
}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}

initFront();
</script>
</body>
</html>
