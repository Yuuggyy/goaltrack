<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
body{background:#0b141a;color:#e9edef;overflow:hidden;height:100vh}
input,textarea,button{font-family:inherit}

#login{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:320px;text-align:center}
.login-card .icon{width:72px;height:72px;border-radius:50%;background:#128C7E;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:32px}
.login-card h2{font-size:24px;font-weight:300;margin-bottom:8px}
.login-card p{font-size:14px;color:#8696a0;margin-bottom:28px}
.login-input{width:100%;padding:14px 16px;border-radius:8px;border:1px solid #2a3942;background:#1f2c34;color:#e9edef;font-size:15px;outline:none;margin-bottom:12px;text-align:center}
.login-input:focus{border-color:#128C7E}
.login-btn{width:100%;padding:14px;border-radius:8px;border:none;background:#128C7E;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-btn:disabled{background:#1a2a32;cursor:not-allowed}
.login-error{color:#f87171;font-size:13px;margin-top:8px;display:none}

#adminPanel{display:none;height:100vh;flex-direction:column}
#adminPanel.active{display:flex}

/* Header */
.admin-header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#075E54;flex-shrink:0}
.admin-header .back{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:14px;cursor:pointer;display:none}
.admin-header .back.active{display:block}
.admin-header .icon{font-size:22px}
.admin-header .title{flex:1}
.admin-header .title h2{font-size:16px;font-weight:600;color:#fff}
.admin-header .title p{font-size:12px;color:#b0d4ce}
.admin-header .logout{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:13px;cursor:pointer}

/* Inbox */
#inboxView{flex:1;overflow-y:auto;background:#111b21}
.inbox-header{padding:12px 16px;font-size:13px;color:#8696a0;background:#0b141a;position:sticky;top:0;z-index:5}
.conv-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #1a2a32;cursor:pointer;transition:background 0.2s}
.conv-item:hover{background:#1f2c34}
.conv-item .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex-shrink:0}
.conv-item .info{flex:1;min-width:0}
.conv-item .name{font-size:15px;font-weight:500;color:#e9edef}
.conv-item .preview{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-item .meta{flex-shrink:0;text-align:right}
.conv-item .time{font-size:11px;color:#8696a0}

/* Chat view */
#chatView{display:none;flex:1;flex-direction:column;height:100vh}
#chatView.active{display:flex}
.messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px;background-color:#0b141a;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23121b22' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 0v4h4v2H6v4H4V6H0V4h4V0h2zm0 30v4h4v2H6v4H4v-4H0v-2h4v-4h2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");padding-bottom:4px}

.msg-row{display:flex;width:100%;margin-bottom:2px}
.msg-row.me{justify-content:flex-end}
.msg-row.them{justify-content:flex-start}
.msg-bubble{max-width:75%;padding:6px 10px 8px;border-radius:8px;font-size:14px;line-height:1.4;position:relative;word-wrap:break-word}
.msg-row.me .msg-bubble{background:#005C4B;color:#e9edef;border-top-right-radius:2px}
.msg-row.them .msg-bubble{background:#1f2c34;color:#e9edef;border-top-left-radius:2px}
.msg-sender{font-size:12px;font-weight:600;margin-bottom:2px}
.msg-time{font-size:10px;color:#8696a0;float:right;margin-top:2px;margin-left:8px}
.msg-image{max-width:220px;max-height:220px;border-radius:6px;cursor:pointer;display:block}
.msg-image-wrap{position:relative}
.msg-image-wrap .msg-time{position:absolute;bottom:4px;right:6px;background:rgba(0,0,0,0.5);padding:1px 5px;border-radius:4px;color:#e9edef}
.msg-voice{display:flex;align-items:center;gap:10px;padding:6px 0;min-width:160px}
.voice-play{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#e9edef;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.voice-wave{flex:1;height:28px;display:flex;align-items:center;gap:2px}
.voice-wave span{width:3px;background:rgba(255,255,255,0.3);border-radius:2px}
.voice-duration{font-size:12px;color:#8696a0;flex-shrink:0}
.msg-file{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.06);border-radius:6px;text-decoration:none;color:#53bdeb;font-size:13px;cursor:pointer}
.msg-location{display:flex;flex-direction:column;gap:4px;text-decoration:none}
.msg-location-map{width:200px;height:120px;border-radius:6px;background:#1a2a32;display:flex;align-items:center;justify-content:center;font-size:32px}
.msg-location-label{font-size:12px;color:#53bdeb;display:flex;align-items:center;gap:4px}
.date-sep{display:flex;justify-content:center;margin:12px 0}
.date-sep span{background:#1f2c34;color:#8696a0;font-size:12px;padding:4px 12px;border-radius:8px}

.input-bar{flex-shrink:0;background:#1f2c34;padding:8px 12px;display:flex;align-items:flex-end;gap:8px}
.msg-input-wrap{flex:1;background:#2a3942;border-radius:24px;padding:2px}
.msg-input{width:100%;min-height:40px;max-height:120px;padding:10px 14px;background:none;border:none;color:#e9edef;font-size:14px;resize:none;outline:none;line-height:1.4}
.msg-input::placeholder{color:#8696a0}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:#128C7E;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

.img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;justify-content:center;align-items:center}
.img-modal.active{display:flex}
.img-modal img{max-width:95%;max-height:95%;border-radius:4px}
.img-modal .close{position:absolute;top:16px;right:16px;color:#fff;font-size:32px;cursor:pointer;background:rgba(0,0,0,0.5);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#128C7E;color:#fff;border-radius:24px;font-size:13px;z-index:200}
</style>
</head>
<body>

<div id="login"><div class="login-card">
  <div class="icon">🔒</div>
  <h2>Admin</h2>
  <p>Mot de passe administrateur</p>
  <input type="password" class="login-input" id="pwdInput" placeholder="Mot de passe..." autocomplete="off">
  <button class="login-btn" id="pwdBtn" disabled>Connexion</button>
  <div class="login-error" id="pwdError">Mot de passe incorrect</div>
</div></div>

<div id="adminPanel">
  <div class="admin-header">
    <button class="back" id="backBtn" onclick="backToInbox()">←</button>
    <div class="icon">💬</div>
    <div class="title"><h2 id="panelTitle">Boîte de réception</h2><p id="onlineStatus">en ligne</p></div>
    <button class="logout" onclick="adminLogout()">Sortir</button>
  </div>
  <div id="inboxView">
    <div class="inbox-header" id="inboxHeader">0 conversation</div>
    <div id="convList"></div>
  </div>
  <div id="chatView">
    <div class="messages" id="adminMessages"></div>
    <div class="input-bar">
      <div class="msg-input-wrap"><textarea class="msg-input" id="adminInput" placeholder="Répondre..." rows="1"></textarea></div>
      <button class="send-btn" onclick="adminSend()">➤</button>
    </div>
  </div>
</div>

<div class="img-modal" id="imgModal" onclick="closeImgModal()"><span class="close">×</span><img id="imgModalSrc" src=""></div>

<script>
const API_URL='https://base44.app/api/apps/6a10802fc1e2a32a74055143/functions/hiddenChat';
const PWD='416admin';const ADMIN='Admin';
let allMsgs=[],curConv=null,curName=null,poll=null;

const pi=document.getElementById('pwdInput'),pb=document.getElementById('pwdBtn');
pi.addEventListener('input',()=>{pb.disabled=pi.value.length<3;document.getElementById('pwdError').style.display='none'});
pi.addEventListener('keydown',e=>{if(e.key==='Enter'&&pi.value.length>=3)doLogin()});
pb.addEventListener('click',doLogin);
function doLogin(){if(pi.value===PWD){localStorage.setItem('gt_admin','1');document.getElementById('login').style.display='none';document.getElementById('adminPanel').classList.add('active');start()}else{document.getElementById('pwdError').style.display='block';pi.value='';pb.disabled=true}}
function adminLogout(){localStorage.removeItem('gt_admin');if(poll)clearInterval(poll);document.getElementById('adminPanel').classList.remove('active');document.getElementById('login').style.display='flex';pi.value='';pb.disabled=true}
function colorFor(n){const c=['#128C7E','#075E54','#db2777','#7c3aed','#2563eb','#16a34a','#dc2626','#ea580c'];let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return c[Math.abs(h)%c.length]}

function start(){fetchAll();poll=setInterval(fetchAll,2000);document.getElementById('adminInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();adminSend()}})}

async function fetchAll(){
  try{const r=await fetch(API_URL+'?admin=1');const d=await r.json();if(d.messages){allMsgs=d.messages;renderInbox();if(curConv)renderChat()}}catch(e){console.error(e)}
}

function getConvs(){
  const m={};
  allMsgs.forEach(msg=>{
    const cid=msg.conversation_id||msg.sender;
    if(cid===ADMIN)return;
    if(!m[cid]){
      const first=allMsgs.find(x=>(x.conversation_id||x.sender)===cid&&x.sender!==ADMIN);
      const msgs=allMsgs.filter(x=>(x.conversation_id||x.sender)===cid);
      m[cid]={id:cid,name:first?first.sender:cid,msgs};
    }
  });
  return Object.values(m).sort((a,b)=>{
    const la=a.msgs.length>0?new Date(a.msgs[a.msgs.length-1].created_at).getTime():0;
    const lb=b.msgs.length>0?new Date(b.msgs[b.msgs.length-1].created_at).getTime():0;
    return lb-la;
  });
}

function renderInbox(){
  const convs=getConvs();
  const list=document.getElementById('convList');
  document.getElementById('inboxHeader').textContent=convs.length+' conversation'+(convs.length>1?'s':'');
  list.innerHTML='';
  if(convs.length===0){list.innerHTML='<div style="text-align:center;padding:40px;color:#8696a0;font-size:14px">Aucune conversation</div>';return}
  convs.forEach(c=>{
    const last=c.msgs[c.msgs.length-1];
    const time=last?new Date(last.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
    const prev=last?(last.sender===ADMIN?'Vous: ':'')+(last.msg_type==='text'?last.content:'📷'):'';    const d=document.createElement('div');
    d.className='conv-item';d.onclick=()=>openConv(c.id,c.name);
    d.innerHTML=`<div class="avatar" style="background:${colorFor(c.name)}">${c.name.charAt(0).toUpperCase()}</div><div class="info"><div class="name">${esc(c.name)}</div><div class="preview">${esc(prev)}</div></div><div class="meta"><div class="time">${time}</div></div>`;
    list.appendChild(d);
  });
}

function openConv(id,name){curConv=id;curName=name;document.getElementById('inboxView').style.display='none';document.getElementById('chatView').classList.add('active');document.getElementById('backBtn').classList.add('active');document.getElementById('panelTitle').textContent=name;renderChat()}
function backToInbox(){curConv=null;curName=null;document.getElementById('chatView').classList.remove('active');document.getElementById('inboxView').style.display='block';document.getElementById('backBtn').classList.remove('active');document.getElementById('panelTitle').textContent='Boîte de réception'}

function renderChat(){
  const msgs=allMsgs.filter(m=>(m.conversation_id||m.sender)===curConv);
  const c=document.getElementById('adminMessages');c.innerHTML='';
  if(msgs.length===0){c.innerHTML='<div style="text-align:center;padding:40px;color:#8696a0">Aucun message</div>';return}
  let lastDate='';
  msgs.forEach(msg=>{
    const d=new Date(msg.created_at);
    const ds=d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
    if(ds!==lastDate){lastDate=ds;const s=document.createElement('div');s.className='date-sep';s.innerHTML=`<span>${ds}</span>`;c.appendChild(s)}
    const isAdmin=msg.sender===ADMIN;
    const row=document.createElement('div');
    row.className='msg-row '+(isAdmin?'me':'them');
    const bub=document.createElement('div');
    bub.className='msg-bubble';
    const time=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    let html='';
    if(!isAdmin)html+=`<div class="msg-sender" style="color:${colorFor(msg.sender)}">${esc(msg.sender)}</div>`;
    if(msg.msg_type==='text')html+=`<div>${esc(msg.content)}</div><span class="msg-time">${time}</span>`;
    else if(msg.msg_type==='image'&&msg.file_url)html+=`<div class="msg-image-wrap"><img src="${msg.file_url}" class="msg-image" onclick="openImg('${msg.file_url}')"><span class="msg-time">${time}</span></div>`;
    else if(msg.msg_type==='voice'&&msg.file_url){let w='<div class="voice-wave">';for(let i=0;i<20;i++){w+=`<span style="height:${4+Math.random()*20}px"></span>`}w+='</div>';html+=`<div class="msg-voice"><button class="voice-play" onclick="playVoice('${msg.file_url}',this)">▶</button>${w}<span class="voice-duration">${msg.content||''}</span></div><span class="msg-time">${time}</span>`}
    else if(msg.msg_type==='file'&&msg.file_url)html+=`<a href="${msg.file_url}" download class="msg-file">📄 ${esc(msg.content||'Fichier')}</a><span class="msg-time">${time}</span>`;
    else if(msg.msg_type==='location')html+=`<a href="https://maps.google.com/?q=${msg.location_lat},${msg.location_lng}" target="_blank" class="msg-location"><div class="msg-location-map">📍</div><div class="msg-location-label">📍 Voir position</div></a><span class="msg-time">${time}</span>`;
    else html+=`<div>${esc(msg.content)}</div><span class="msg-time">${time}</span>`;
    bub.innerHTML=html;row.appendChild(bub);c.appendChild(row);
  });
  c.scrollTop=c.scrollHeight;
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function adminSend(){const inp=document.getElementById('adminInput'),t=inp.value.trim();if(!t||!curConv)return;inp.value='';inp.style.height='auto';try{await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:ADMIN,content:t,msgType:'text',conversationId:curConv})});await fetchAll()}catch(e){showToast('Erreur')}}
function openImg(u){document.getElementById('imgModalSrc').src=u;document.getElementById('imgModal').classList.add('active')}
function closeImgModal(){document.getElementById('imgModal').classList.remove('active')}
function playVoice(u,b){if(b._audio){b._audio.pause();b._audio=null;b.textContent='▶';return}const a=new Audio(u);b._audio=a;b.textContent='⏸';a.onended=()=>{b.textContent='▶';b._audio=null};a.play().catch(()=>{b.textContent='▶'})}
function showToast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
document.getElementById('adminInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
if(localStorage.getItem('gt_admin')==='1'){document.getElementById('login').style.display='none';document.getElementById('adminPanel').classList.add('active');start()}
</script>
</body>
</html>
