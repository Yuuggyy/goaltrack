<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
:root{--bg:#0b141a;--bg2:#111b21;--bg3:#1f2c34;--bg4:#2a3942;--green:#128C7E;--green2:#005C4B;--green3:#075E54;--text:#e9edef;--gray:#8696a0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
input,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

#login{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.l-card{text-align:center;width:100%;max-width:300px}
.l-ico{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}
.l-card h2{font-size:22px;font-weight:400;margin-bottom:6px}
.l-card p{font-size:13px;color:var(--gray);margin-bottom:24px}
.l-input{width:100%;padding:14px;border-radius:8px;border:1px solid var(--bg4);background:var(--bg3);color:var(--text);font-size:15px;text-align:center;outline:none;margin-bottom:10px}
.l-input:focus{border-color:var(--green)}
.l-btn{width:100%;padding:14px;border-radius:8px;background:var(--green);color:#fff;font-weight:600;font-size:15px}
.l-btn:disabled{background:#1a2a32;color:var(--gray)}
.l-err{color:#f87171;font-size:12px;margin-top:8px;display:none}

#panel{display:none;height:100%;flex-direction:column}
#panel.show{display:flex}

.h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--green3);flex-shrink:0}
.h-back{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,0.12);color:#fff;font-size:14px;display:none}
.h-back.show{display:block}
.h-ico{font-size:20px}
.h-title{flex:1;min-width:0}
.h-title h2{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-title p{font-size:11px;color:#b0d4ce}
.h-out{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.12);color:#fff;font-size:13px}

#inbox{flex:1;overflow-y:auto;background:var(--bg2)}
.i-header{padding:10px 14px;font-size:12px;color:var(--gray);background:var(--bg);position:sticky;top:0;z-index:5}
.conv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1a2a32;transition:background 0.15s}
.conv:active{background:var(--bg3)}
.conv .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;flex-shrink:0}
.conv .ci{flex:1;min-width:0}
.conv .cn{font-size:14px;font-weight:500}
.conv .cp{font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv .ct{font-size:10px;color:var(--gray);flex-shrink:0}

#chat{display:none;flex:1;flex-direction:column;height:100%}
#chat.show{display:flex}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 8px;display:flex;flex-direction:column;gap:1px;background:var(--bg)}
.r{display:flex;width:100%}
.r.me{justify-content:flex-end}
.r.them{justify-content:flex-start}
.b{max-width:78%;padding:5px 9px 7px;border-radius:8px;font-size:14px;line-height:1.4;word-break:break-word}
.r.me .b{background:var(--green2);border-top-right-radius:2px}
.r.them .b{background:var(--bg3);border-top-left-radius:2px}
.b-sender{font-size:12px;font-weight:600;margin-bottom:1px}
.b-time{font-size:9px;color:rgba(255,255,255,0.4);float:right;margin-top:3px;margin-left:6px}
.d-sep{display:flex;justify-content:center;margin:10px 0}
.d-sep span{background:var(--bg3);color:var(--gray);font-size:11px;padding:3px 10px;border-radius:6px}
.empty{text-align:center;padding:30px;color:var(--gray);font-size:13px}

.bar{flex-shrink:0;display:flex;align-items:flex-end;gap:6px;padding:6px 10px;background:var(--bg3)}
.bar .wrap{flex:1;background:var(--bg4);border-radius:22px;padding:1px}
.bar input{width:100%;min-height:38px;max-height:100px;padding:9px 12px;background:none;border:none;color:var(--text);font-size:14px;resize:none;outline:none;line-height:1.3}
.bar input::placeholder{color:var(--gray)}
.bar .send{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s}
.bar .send:active{transform:scale(0.85)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:8px 18px;background:var(--green);color:#fff;border-radius:20px;font-size:12px;z-index:200}
</style>
</head>
<body>

<div id="login"><div class="l-card">
  <div class="l-ico">🔒</div>
  <h2>Admin</h2>
  <p>Mot de passe administrateur</p>
  <input type="password" class="l-input" id="pwd" placeholder="Mot de passe..." autocomplete="off">
  <button class="l-btn" id="pwdBtn" disabled>Connexion</button>
  <div class="l-err" id="pwdErr">Mot de passe incorrect</div>
</div></div>

<div id="panel">
  <div class="h">
    <button class="h-back" id="backBtn" onclick="goBack()">←</button>
    <div class="h-ico">💬</div>
    <div class="h-title"><h2 id="hTitle">Boîte de réception</h2><p>en ligne</p></div>
    <button class="h-out" onclick="logout()">Sortir</button>
  </div>
  <div id="inbox">
    <div class="i-header" id="iHeader">0 conversation</div>
    <div id="convList"></div>
  </div>
  <div id="chat">
    <div class="msgs" id="aMsgs"></div>
    <div class="bar">
      <div class="wrap"><textarea id="aInput" placeholder="Répondre..." rows="1"></textarea></div>
      <button class="send" onclick="aSend()">➤</button>
    </div>
  </div>
</div>

<script>
const API='https://base44.app/api/apps/6a10802fc1e2a32a74055143/functions/hiddenChat';
const PWD='416admin';const ADMIN='Admin';
let allMsgs=[],curConv=null,curName=null,timer=null;

// Login
const pwd=document.getElementById('pwd'),pwdBtn=document.getElementById('pwdBtn');
pwd.oninput=()=>{pwdBtn.disabled=pwd.value.length<3;document.getElementById('pwdErr').style.display='none'};
pwd.onkeydown=e=>{if(e.key==='Enter'&&pwd.value.length>=3)doLogin()};
pwdBtn.onclick=doLogin;
function doLogin(){
  if(pwd.value===PWD){
    localStorage.setItem('gt_admin','1');
    document.getElementById('login').style.display='none';
    document.getElementById('panel').classList.add('show');
    start();
  }else{
    document.getElementById('pwdErr').style.display='block';
    pwd.value='';pwdBtn.disabled=true;
  }
}
function logout(){
  localStorage.removeItem('gt_admin');
  if(timer)clearInterval(timer);
  document.getElementById('panel').classList.remove('show');
  document.getElementById('login').style.display='flex';
  pwd.value='';pwdBtn.disabled=true;
}

function colorFor(n){
  const c=['#128C7E','#075E54','#db2777','#7c3aed','#2563eb','#16a34a','#dc2626','#ea580c'];
  let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);
  return c[Math.abs(h)%c.length];
}

function start(){
  fetchAll();
  timer=setInterval(fetchAll,2000);
  const inp=document.getElementById('aInput');
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aSend();}};
  inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px';};
}

async function fetchAll(){
  try{
    const r=await fetch(API+'?admin=1');
    const d=await r.json();
    if(d&&d.messages){allMsgs=d.messages;drawInbox();if(curConv)drawChat();}
  }catch(e){}
}

function getConvs(){
  const m={};
  allMsgs.forEach(msg=>{
    const cid=msg.conversation_id||msg.sender;
    if(cid===ADMIN)return;
    if(!m[cid]){
      const first=allMsgs.find(x=>(x.conversation_id||x.sender)===cid&&x.sender!==ADMIN);
      const all=allMsgs.filter(x=>(x.conversation_id||x.sender)===cid);
      m[cid]={id:cid,name:first?first.sender:cid,msgs:all};
    }
  });
  return Object.values(m).sort((a,b)=>{
    const la=a.msgs.length?new Date(a.msgs[a.msgs.length-1].created_at).getTime():0;
    const lb=b.msgs.length?new Date(b.msgs[b.msgs.length-1].created_at).getTime():0;
    return lb-la;
  });
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function drawInbox(){
  const convs=getConvs();
  const list=document.getElementById('convList');
  document.getElementById('iHeader').textContent=convs.length+' conversation'+(convs.length>1?'s':'');
  if(!convs.length){list.innerHTML='<div class="empty">Aucune conversation</div>';return;}
  list.innerHTML=convs.map(c=>{
    const last=c.msgs[c.msgs.length-1];
    const t=last?new Date(last.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
    const p=last?(last.sender===ADMIN?'Vous: ':'')+last.content.substring(0,40):'';
    return `<div class="conv" onclick="openConv('${c.id}','${esc(c.name)}')"><div class="av" style="background:${colorFor(c.name)}">${c.name.charAt(0).toUpperCase()}</div><div class="ci"><div class="cn">${esc(c.name)}</div><div class="cp">${esc(p)}</div></div><div class="ct">${t}</div></div>`;
  }).join('');
}

function openConv(id,name){
  curConv=id;curName=name;
  document.getElementById('inbox').style.display='none';
  document.getElementById('chat').classList.add('show');
  document.getElementById('backBtn').classList.add('show');
  document.getElementById('hTitle').textContent=name;
  drawChat();
  document.getElementById('aInput').focus();
}

function goBack(){
  curConv=null;curName=null;
  document.getElementById('chat').classList.remove('show');
  document.getElementById('inbox').style.display='block';
  document.getElementById('backBtn').classList.remove('show');
  document.getElementById('hTitle').textContent='Boîte de réception';
}

function drawChat(){
  const msgs=allMsgs.filter(m=>(m.conversation_id||m.sender)===curConv);
  const c=document.getElementById('aMsgs');
  if(!msgs.length){c.innerHTML='<div class="empty">Aucun message</div>';return;}
  let html='',lastDate='';
  msgs.forEach(m=>{
    const d=new Date(m.created_at);
    const ds=d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
    if(ds!==lastDate){lastDate=ds;html+='<div class="d-sep"><span>'+ds+'</span></div>';}
    const isAdmin=m.sender===ADMIN;
    const t=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    let inner='';
    if(!isAdmin)inner+='<div class="b-sender" style="color:'+colorFor(m.sender)+'">'+esc(m.sender)+'</div>';
    inner+='<div>'+esc(m.content)+'</div><span class="b-time">'+t+'</span>';
    html+='<div class="r '+(isAdmin?'me':'them')+'"><div class="b">'+inner+'</div></div>';
  });
  c.innerHTML=html;
  c.scrollTop=c.scrollHeight;
}

async function aSend(){
  const inp=document.getElementById('aInput');
  const txt=inp.value.trim();
  if(!txt||!curConv)return;
  inp.value='';inp.style.height='auto';
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      sender:ADMIN,content:txt,msgType:'text',conversationId:curConv
    })});
    await fetchAll();
  }catch(e){toast('Erreur');}
}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}

if(localStorage.getItem('gt_admin')==='1'){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').classList.add('show');
  start();
}
</script>
</body>
</html>
